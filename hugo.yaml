title: Lab Notes

module:
  # Same version as HUGO_VERSION in .github/workflows/pages.yaml. Older releases
  # fail on the build-time math (layouts/_markup/render-passthrough.html).
  hugoVersion:
    min: 0.166.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      # Math is rendered at build time (Hextra >= 0.10, transform.ToMath), so
      # LaTeX inside $...$ / $$...$$ must reach KaTeX untouched by Markdown.
      # Only dollar delimiters: some articles use a literal \[ \] in plain text.
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
  highlight:
    noClasses: false
defaultContentLanguage: ru
# Page lastmod from the last commit that touched the file: feeds <lastmod> in
# sitemap.xml, article:modified_time and dateModified in the JSON-LD.
enableGitInfo: true
menu:
  main:
    - identifier: sections
      name: Разделы
      weight: 1
    - name: Аналитическая химия
      parent: sections
      pageRef: /analiticheskaya-himiya/
      weight: 1
    - name: ВМС
      parent: sections
      pageRef: /vms/
      weight: 2
    - name: Квантовая химия
      parent: sections
      pageRef: /kvantovaya-himiya/
      weight: 3
    - name: Коллоидная химия
      parent: sections
      pageRef: /kolloidnaya-himiya/
      weight: 4
    - name: Физическая химия
      parent: sections
      pageRef: /fizicheskaya-himiya/
      weight: 5
    - name: Химическая технология
      parent: sections
      pageRef: /himicheskaya-tehnologiya/
      weight: 6
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 6
      url: 'https://github.com/fgazat/labnotes'
      params:
        icon: github
    - name: Twitter
      weight: 7
      url: 'https://x.com/fgazatdev'
      params:
        icon: x-twitter
    - name: Telegram
      weight: 5
      url: 'https://t.me/labnotesru'
      params:
        icon: telegram
  sidebar:
    - name: Ещё
      params:
        type: separator
      weight: 1
    - name: 'Telegram-канал ↗'
      url: 'https://t.me/labnotesru/'
      weight: 3

params:
  description: Конспекты лекций по физической, квантовой и коллоидной химии и химии ВМС для студентов.
  # Default Open Graph / Twitter image (link previews in Telegram etc.).
  # A page can override it with its own `images:` front matter list.
  images:
    - /images/og-image.png
  math:
    katex:
      # Formulas are rendered at build time by the KaTeX embedded in Hugo; only
      # the stylesheet and fonts are loaded by the browser. Keep this version in
      # step with Hugo's embedded KaTeX (0.18.4 for the HUGO_VERSION in pages.yaml).
      base: https://cdn.jsdelivr.net/npm/katex@0.18.4/dist
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /images/logo.svg
      dark: /images/logo.svg
      link: /
      height: 20
  footer:
    displayCopyright: false
    displayPoweredBy: false
  theme:
    # light | dark | system
    default: light
    displayToggle: false
  editURL:
    enable: true
    base: 'https://github.com/fgazat/labnotes/edit/master/content'
services:
  googleAnalytics:
    ID: G-CXYZWL70YN
